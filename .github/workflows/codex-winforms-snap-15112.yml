name: Verify WinForms window snapping

on:
  push:
    branches: [validation/winforms-snap-15112-b]

permissions:
  contents: read

jobs:
  snap:
    name: ${{ matrix.arch }} ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            configuration: Debug
            rounds: 25
          - arch: x86
            configuration: Release
            rounds: 25
          - arch: x64
            configuration: Debug
            rounds: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and repeat the actual shell snap tests
        run: |
          & ./.validation/Test-Snap.ps1 -Architecture ${{ matrix.arch }} -Configuration ${{ matrix.configuration }} -Rounds ${{ matrix.rounds }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-${{ matrix.arch }}-${{ matrix.configuration }}
          path: snap-results/
          if-no-files-found: warn
          retention-days: 14
